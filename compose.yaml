services:
  naming-pool:
    build: .
    image: naming-pool:latest
    env_file:
      - .env
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - naming-pool-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  naming-pool-data:
